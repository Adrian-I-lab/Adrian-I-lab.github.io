{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  /* Default to the refined dark theme before first paint (no flash of light).
     Honors an explicit stored choice; treats "system" as system preference. */
  (function () {
    try {
      var t = localStorage.getItem("theme");
      var dark = (t === "light") ? false
               : (t === "system") ? window.matchMedia("(prefers-color-scheme: dark)").matches
               : true; /* no stored preference -> dark by default */
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>

<!-- Web fonts: Source Serif 4 (headings) + Inter (body) -->
